# =============================================================================
# Staging: backend de Supabase. Se dispara al promover develop -> staging.
#
# La base se DESTRUYE y se reconstruye entera en cada despliegue: en staging
# eso es una virtud, porque garantiza que las migraciones funcionan desde cero
# y no solo encadenadas sobre lo que ya había.
#
# El filtro `paths` es lo que evita que un cambio puramente de interfaz resetee
# la base. Va en el TRIGGER, no en un `if` de job: hubo una versión con
#   if: contains(github.event.head_commit.modified, 'supabase/')
# que nunca se cumplía —`contains` sobre un array compara elementos completos,
# no subcadenas— y el resultado fue un frontend desplegado contra una base
# vacía, con 404 en toda la zona pública. Un filtro que falla en silencio es
# peor que no filtrar. Si hace falta forzar el ciclo completo sin tocar
# migraciones, "Run workflow" (workflow_dispatch).
#
# La calidad (tipos, lint, build) vive en calidad.yml y corre siempre, también
# en los pushes que este filtro deja pasar de largo.
# =============================================================================

name: Desplegar a staging

on:
  push:
    branches: [staging]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase/seed.sql'
      # Los ejecuta este pipeline (smokes, e2e y alta del equipo): si cambian,
      # hay que re-correr.
      - 'scripts/**'
      - '.github/workflows/desplegar-staging.yml'
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  # Un solo job, como en Pronto: los smokes son pasos previos al despliegue, no
  # un job aparte. Si fallan, el job se detiene antes de tocar la base remota,
  # que es la única garantía que hacía falta conservar.
  desplegar_staging:
    name: Reset DB + Edge Functions + auth (staging)
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      DB_URL: ${{ secrets.STAGING_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # La MISMA versión que la devDependency "supabase" del package.json. Si se
      # separan, un config.toml que la CLI local acepta puede tumbar el pipeline.
      - name: Instalar la CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # --- Pruebas contra un Supabase LOCAL levantado en el propio runner. Las
      #     suites van envueltas en transacciones con rollback, así que no
      #     ensucian nada. Van antes del reset: si el esquema no se sostiene
      #     desde cero, no se despliega.
      - name: Levantar Supabase local
        run: supabase start

      - name: Baterías de smokes
        run: bash ./scripts/run-smokes.sh
        env:
          MVSE_DB_CONTAINER: supabase_db_mivotoseescucha

      - name: Recorrido del vecino de punta a punta
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" > .env.ci
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> .env.ci
          echo "NEXT_PUBLIC_CIUDAD_POR_DEFECTO=el-triunfo" >> .env.ci
          node --env-file=.env.ci scripts/e2e-vecino.mjs

      # Se apaga antes de tocar el remoto: todos los pasos que siguen llevan
      # --db-url o --project-ref explícito, pero dejar la pila local encendida
      # solo invita a que un comando futuro se equivoque de destino.
      - name: Apagar Supabase local
        run: supabase stop --no-backup

      - name: Reconstruir la base desde cero
        # Aplica migraciones y, detrás, el seed: config.toml tiene
        # [db.seed] enabled = true con ./seed.sql.
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::Falta el secreto STAGING_DB_URL"; exit 1; fi
          supabase db reset --db-url "$DB_URL" --yes

      - name: Guardar secretos en el Vault
        # El cron los lee de aquí. Se borran y se vuelven a crear en cada
        # despliegue para que no queden valores viejos de un ambiente anterior.
        run: |
          psql "$DB_URL" -c "delete from vault.secrets where name in ('url_base_funciones','secreto_worker');"
          psql "$DB_URL" -c "select vault.create_secret('https://${PROJECT_REF}.supabase.co/functions/v1', 'url_base_funciones');"
          psql "$DB_URL" -c "select vault.create_secret('${{ secrets.STAGING_WORKER_SECRET }}', 'secreto_worker');"

      - name: Inyectar secretos a las Edge Functions
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_PHONE_NUMBER_ID: ${{ secrets.KAPSO_PHONE_NUMBER_ID }}
          SEND_SMS_HOOK_SECRET: ${{ secrets.STAGING_SEND_SMS_HOOK_SECRET }}
          WORKER_SECRET: ${{ secrets.STAGING_WORKER_SECRET }}
        run: |
          # Nada de esto se escribe a mano en el panel de Supabase: si un valor
          # solo vive en la interfaz, se pierde en el siguiente reset.
          {
            echo "KAPSO_API_KEY=\"$KAPSO_API_KEY\""
            echo "KAPSO_PHONE_NUMBER_ID=\"$KAPSO_PHONE_NUMBER_ID\""
            echo "KAPSO_TEMPLATE_PREFIX=\"mvse_staging\""
            echo "KAPSO_TEMPLATE_LANG=\"es\""
            echo "KAPSO_OTP_TEMPLATE=\"mvse_staging_otp\""
            echo "SEND_SMS_HOOK_SECRET=\"$SEND_SMS_HOOK_SECRET\""
            echo "WORKER_SECRET=\"$WORKER_SECRET\""
            echo "APP_BASE_URL=\"${{ vars.STAGING_SITIO_URL }}\""
          } > /tmp/funciones.env
          supabase secrets set --env-file /tmp/funciones.env --project-ref "$PROJECT_REF"
          rm -f /tmp/funciones.env

      - name: Desplegar Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Configurar auth (teléfono, hook de WhatsApp y números de prueba)
        env:
          SEND_SMS_HOOK_SECRET: ${{ secrets.STAGING_SEND_SMS_HOOK_SECRET }}
          # Números con código fijo: entran sin gastar un WhatsApp real ni
          # depender de que Meta haya aprobado la plantilla. Van como secreto y
          # no escritos aquí para poder rotarlos sin tocar el repositorio.
          # Formato: 593990000001=123456,593990000002=654321
          TEST_OTP: ${{ secrets.STAGING_TEST_OTP }}
        run: |
          # El hook es lo que hace que el código salga por WhatsApp en vez de
          # por SMS. Sin registrarlo, Supabase intenta usar un proveedor de SMS
          # que no existe y ningún código llega nunca.
          cat > /tmp/auth.json <<EOF
          {
            "external_phone_enabled": true,
            "hook_send_sms_enabled": true,
            "hook_send_sms_uri": "https://${PROJECT_REF}.supabase.co/functions/v1/enviar-otp-whatsapp",
            "hook_send_sms_secrets": "$SEND_SMS_HOOK_SECRET",
            "sms_test_otp": "$TEST_OTP",
            "sms_test_otp_valid_until": "2099-01-01T00:00:00Z",
            "site_url": "${{ vars.STAGING_SITIO_URL }}",
            "uri_allow_list": "${{ vars.STAGING_SITIO_URL }},${{ vars.STAGING_SITIO_URL }}/**"
          }
          EOF
          curl -sS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/auth.json --fail-with-body
          rm -f /tmp/auth.json

      - name: Crear la cuenta del equipo
        env:
          ADMIN_CORREO: ${{ secrets.STAGING_ADMIN_CORREO }}
          ADMIN_CLAVE: ${{ secrets.STAGING_ADMIN_CLAVE }}
          SUPABASE_URL: https://${{ vars.STAGING_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
        run: node scripts/crear-cuenta-equipo.mjs

      # Segunda pasada, ya contra el ambiente REAL y desplegado. La del
      # principio corre contra la base local del runner y prueba que el esquema
      # levanta desde cero; esta prueba que staging quedó sano de verdad, con
      # sus políticas, sus grants y su seed puestos. Las suites van en
      # begin/rollback, así que no dejan rastro.
      - name: Verificar staging con los smokes (contra la base real)
        env:
          MVSE_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: bash ./scripts/run-smokes.sh
