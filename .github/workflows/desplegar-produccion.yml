# =============================================================================
# Producción. Se dispara al empujar a `main`.
#
# Idéntico a staging salvo en lo único que importa: aquí se hace `db push`, no
# `db reset`. Se aplican las migraciones nuevas y nada más. Un reset aquí
# borraría el padrón de vecinos, que es el activo del negocio.
#
# Igual que en staging, la parte de base de datos corre solo si el cambio toca
# supabase/.
# =============================================================================

name: Desplegar a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  calidad:
    name: Tipos, lint y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITIO_URL: ${{ vars.PROD_SITIO_URL }}

  pruebas:
    name: Pruebas de la base
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'supabase/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: ./scripts/run-smokes.sh
        env:
          MVSE_DB_CONTAINER: supabase_db_mivotoseescucha
      - name: Recorrido del vecino de punta a punta
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" > .env.ci
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> .env.ci
          echo "NEXT_PUBLIC_CIUDAD_POR_DEFECTO=el-triunfo" >> .env.ci
          node --env-file=.env.ci scripts/e2e-vecino.mjs

  base_de_datos:
    name: Base de datos y funciones
    runs-on: ubuntu-latest
    needs: [calidad, pruebas]
    if: contains(github.event.head_commit.modified, 'supabase/') || github.event_name == 'workflow_dispatch'
    environment: produccion
    env:
      PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
      DB_URL: ${{ secrets.PROD_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migraciones nuevas
        # push, NUNCA reset. Aquí viven los vecinos verificados de verdad.
        run: supabase db push --db-url "$DB_URL"

      - name: Actualizar secretos del Vault
        run: |
          psql "$DB_URL" -c "delete from vault.secrets where name in ('url_base_funciones','secreto_worker');"
          psql "$DB_URL" -c "select vault.create_secret('https://${PROJECT_REF}.supabase.co/functions/v1', 'url_base_funciones');"
          psql "$DB_URL" -c "select vault.create_secret('${{ secrets.PROD_WORKER_SECRET }}', 'secreto_worker');"

      - name: Inyectar secretos a las Edge Functions
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_PHONE_NUMBER_ID: ${{ secrets.PROD_KAPSO_PHONE_NUMBER_ID }}
          SEND_SMS_HOOK_SECRET: ${{ secrets.PROD_SEND_SMS_HOOK_SECRET }}
          WORKER_SECRET: ${{ secrets.PROD_WORKER_SECRET }}
        run: |
          {
            echo "KAPSO_API_KEY=\"$KAPSO_API_KEY\""
            echo "KAPSO_PHONE_NUMBER_ID=\"$KAPSO_PHONE_NUMBER_ID\""
            echo "KAPSO_TEMPLATE_PREFIX=\"mvse_prod\""
            echo "KAPSO_TEMPLATE_LANG=\"es\""
            echo "KAPSO_OTP_TEMPLATE=\"mvse_prod_otp\""
            echo "SEND_SMS_HOOK_SECRET=\"$SEND_SMS_HOOK_SECRET\""
            echo "WORKER_SECRET=\"$WORKER_SECRET\""
            echo "APP_BASE_URL=\"${{ vars.PROD_SITIO_URL }}\""
          } > /tmp/funciones.env
          supabase secrets set --env-file /tmp/funciones.env --project-ref "$PROJECT_REF"
          rm -f /tmp/funciones.env

      - name: Desplegar Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Configurar auth
        env:
          SEND_SMS_HOOK_SECRET: ${{ secrets.PROD_SEND_SMS_HOOK_SECRET }}
        run: |
          # En producción solo va el número del revisor, si hace falta uno.
          # Cada número de prueba es una puerta que no gasta WhatsApp real.
          cat > /tmp/auth.json <<EOF
          {
            "external_phone_enabled": true,
            "hook_send_sms_enabled": true,
            "hook_send_sms_uri": "https://${PROJECT_REF}.supabase.co/functions/v1/enviar-otp-whatsapp",
            "hook_send_sms_secrets": "$SEND_SMS_HOOK_SECRET",
            "sms_test_otp": "${{ secrets.PROD_TEST_OTP }}",
            "sms_test_otp_valid_until": "2099-01-01T00:00:00Z",
            "site_url": "${{ vars.PROD_SITIO_URL }}",
            "uri_allow_list": "${{ vars.PROD_SITIO_URL }},${{ vars.PROD_SITIO_URL }}/**"
          }
          EOF
          curl -sS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/auth.json --fail-with-body
          rm -f /tmp/auth.json

      - name: Revisar avisos de seguridad de Supabase
        # No detiene el despliegue, pero deja en el registro cualquier tabla sin
        # políticas o función con search_path suelto que se haya colado.
        continue-on-error: true
        run: |
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/advisors/security" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | tee avisos.json
          if grep -q '"level":"ERROR"' avisos.json; then
            echo "::warning::Hay avisos de seguridad en producción. Revísalos."
          fi
