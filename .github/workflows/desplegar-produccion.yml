# =============================================================================
# Producción: backend de Supabase. Se dispara al promover staging -> main.
#
# ┌─ PRELANZAMIENTO ────────────────────────────────────────────────────────┐
# │ Mientras producción NO tenga vecinos reales, se reconstruye entera en   │
# │ cada despliegue (`db reset`), igual que staging. Así se pueden seguir   │
# │ EDITANDO las migraciones existentes en vez de apilar una nueva por cada │
# │ cambio: todavía no hay datos que conservar.                             │
# │                                                                         │
# │ Lo gobierna la VARIABLE de repositorio `PRODUCCION_PRELANZAMIENTO`      │
# │ (Settings -> Secrets and variables -> Actions -> Variables):            │
# │   'true'  -> RESET (borra y reconstruye). Solo antes del lanzamiento.   │
# │   ausente -> PUSH (solo migraciones nuevas). El modo definitivo.        │
# │                                                                         │
# │ EL DÍA DEL LANZAMIENTO: borra esa variable. No hay que tocar este       │
# │ archivo — un despliegue no puede volverse destructivo por un descuido   │
# │ de código, y quitar el modo destructivo debe ser un clic, no un commit. │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Una vez lanzado, la diferencia con staging es que aquí NUNCA se resetea:
# `db push` aplica solo migraciones nuevas. Por eso, a partir de ese día, cada
# cambio de esquema es una migración NUEVA y jamás se edita una ya aplicada.
#
# El filtro `paths` va en el TRIGGER, no en un `if` de job — ver la nota en
# desplegar-staging.yml sobre por qué. La calidad vive en calidad.yml.
# =============================================================================

name: Desplegar a producción

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'supabase/seed.sql'
      - 'scripts/**'
      - '.github/workflows/desplegar-produccion.yml'
  workflow_dispatch:

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  # Un solo job, como en Pronto: los smokes son pasos previos al despliegue, no
  # un job aparte. Si fallan, el job se detiene antes de tocar la base real.
  desplegar_produccion:
    name: Push DB + auth (producción)
    runs-on: ubuntu-latest
    environment: produccion
    env:
      PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
      DB_URL: ${{ secrets.PROD_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # La MISMA versión que la devDependency "supabase" del package.json.
      - name: Instalar la CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # --- Pruebas contra un Supabase LOCAL en el propio runner, antes de tocar
      #     nada real. Rollback por transacción: no ensucian.
      - name: Levantar Supabase local
        run: supabase start

      - name: Baterías de smokes
        run: bash ./scripts/run-smokes.sh
        env:
          MVSE_DB_CONTAINER: supabase_db_mivotoseescucha

      - name: Apagar Supabase local
        run: supabase stop --no-backup

      # 1) MIGRACIONES. Dos caminos EXCLUYENTES según PRODUCCION_PRELANZAMIENTO.

      # 1a) PRELANZAMIENTO: reconstruye la base entera. Destructivo a propósito
      #     —no hay datos reales todavía— y es lo que permite seguir editando
      #     las migraciones existentes en vez de apilar una nueva por cada
      #     cambio. Aplica también el seed ([db.seed] en config.toml).
      - name: '⚠ PRELANZAMIENTO — reset total de la base (migraciones + seed)'
        if: vars.PRODUCCION_PRELANZAMIENTO == 'true'
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::Falta el secreto PROD_DB_URL"; exit 1; fi
          echo "::warning::PRODUCCION_PRELANZAMIENTO=true → se BORRA y reconstruye la base de producción."
          supabase db reset --db-url "$DB_URL" --yes

      # 1b) LANZADO: solo migraciones nuevas. Es el modo definitivo.
      #     Aquí viven los vecinos verificados de verdad.
      - name: Aplicar migraciones nuevas (push, no destructivo)
        if: vars.PRODUCCION_PRELANZAMIENTO != 'true'
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::Falta el secreto PROD_DB_URL"; exit 1; fi
          supabase db push --db-url "$DB_URL"

      - name: Configurar auth (sesiones anónimas y URL del sitio)
        env:
          SITIO_URL: ${{ vars.PROD_SITIO_URL }}
        run: |
          # El vecino entra con una sesión anónima que el navegador crea sola.
          # Si esto queda apagado, la portada se ve pero el botón Apoyar
          # responde 422 en cada toque y no hay producto. Se fija desde el
          # pipeline y no a mano en el panel: lo que solo vive en la interfaz
          # se pierde al recrear el proyecto y nadie se acuerda de por qué.
          #
          # El tope por hora y por IP va alto a propósito: cientos de personas
          # del cantón salen por la misma IP del operador móvil, y con el valor
          # de fábrica (30) una jornada de territorio deja a media brigada sin
          # poder apoyar.
          if [ -z "$SITIO_URL" ]; then
            echo "::error::Falta la Variable PROD_SITIO_URL (la URL pública, sin barra final)."
            exit 1
          fi

          cat > /tmp/auth.json <<EOF
          {
            "external_anonymous_users_enabled": true,
            "rate_limit_anonymous_users": 300,
            "site_url": "$SITIO_URL",
            "uri_allow_list": "$SITIO_URL,$SITIO_URL/**"
          }
          EOF
          curl -sS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/auth.json --fail-with-body
          rm -f /tmp/auth.json

      - name: Crear la cuenta del equipo
        env:
          ADMIN_CORREO: ${{ secrets.PROD_ADMIN_CORREO }}
          ADMIN_CLAVE: ${{ secrets.PROD_ADMIN_CLAVE }}
          SUPABASE_URL: https://${{ vars.PROD_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SERVICE_ROLE_KEY }}
        run: node scripts/crear-cuenta-equipo.mjs

      - name: Revisar avisos de seguridad de Supabase
        # No detiene el despliegue, pero deja en el registro cualquier tabla sin
        # políticas o función con search_path suelto que se haya colado.
        continue-on-error: true
        run: |
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/advisors/security" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | tee avisos.json
          if grep -q '"level":"ERROR"' avisos.json; then
            echo "::warning::Hay avisos de seguridad en producción. Revísalos."
          fi
